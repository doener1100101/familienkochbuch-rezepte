name: Bilder pflegen
# Außerdem: Dateiliste "dateien.txt" aktuell halten (für den Abendlauf, dem die GitHub-API gesperrt ist).

# Bringt jedes Rezeptbild auf höchstens 1080 px und etwa 200 KB.
# Liegt neben einem Bild eine Datei "<Name>.zuschnitt.md" (vom Abendlauf), wird vorher zugeschnitten.
on:
  push:
    branches: [ main ]
    paths-ignore: [ 'dateien.txt' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bilder
  cancel-in-progress: false

jobs:
  pflegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow pillow-avif-plugin || pip install --quiet pillow
      - run: python3 .github/scripts/bilder.py
      - name: Dateiliste
        run: git add -A Rezepte/Bilder && git ls-files -z | tr '\0' '\n' | grep -v '^dateien.txt$' | sort > dateien.txt
      - name: Speichern
        run: |
          git config user.name "Bildpflege"
          git config user.email "bildpflege@users.noreply.github.com"
          git add -A Rezepte/Bilder dateien.txt
          if git diff --cached --quiet; then echo "Nichts zu tun"; exit 0; fi
          git commit -m "Bilder gepflegt / Dateiliste aktualisiert"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
